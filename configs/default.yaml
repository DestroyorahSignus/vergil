# VERGIL reference defaults — NOT auto-loaded.
# The Modal build pipeline (modal_build.py) and library defaults hardcode their
# own constants; this file documents them in one place. Keep it in sync.

dataset:
  category: Electronics          # one of the Amazon Reviews 2023 categories
  subsample_top_n: 50000         # top products by rating_number
  raw_dir: data/raw

encoder:
  # off-the-shelf default; SPARDA may inject DANTE's fine-tuned bi-encoder instead
  name: BAAI/bge-small-en-v1.5

graph:
  similarity_threshold: 0.85     # cosine cutoff for similar_to edges
  similarity_top_k: 5            # max similar_to edges per product node

community:
  leiden_resolution: 4.0         # higher = smaller, more specific communities (1.0 gave 25 blob communities for 50K products; 4.0 -> 73)
  level1_resolution_factor: 0.5  # L1 resolution = resolution * this

retrieval:
  top_k: 5                       # results returned to the LLM
  colbert_k: 50                  # candidates ColBERT retrieves before graph expansion
  max_hops: 2                    # multi-hop BFS depth

llm:
  model_id: Qwen/Qwen3-4B-Instruct-2507   # transformers backend (Modal A100)
  # llama_cpp fallback (Kaggle T4): Qwen3-4B-Instruct-2507-GGUF Q4_K_M
  n_ctx: 4096
  n_gpu_layers: -1
  max_tokens: 600
  temperature: 0.1
